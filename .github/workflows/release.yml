name: Release

# Erstellt automatisch Tag + GitHub Release, sobald sich die Version in manifest.json ändert.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version lesen und prüfen, ob Tag existiert
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Keine Version in manifest.json gefunden"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION existiert bereits – kein Release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: XPI bauen
        if: steps.version.outputs.exists == 'false'
        run: ./build.sh

      - name: updates.json erzeugen
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          ID=$(jq -r '.applications.zotero.id' manifest.json)
          MIN=$(jq -r '.applications.zotero.strict_min_version' manifest.json)
          MAX=$(jq -r '.applications.zotero.strict_max_version' manifest.json)
          LINK="https://github.com/$REPO/releases/download/v$VERSION/zotero-auto-translate-$VERSION.xpi"
          jq -n --arg id "$ID" --arg v "$VERSION" --arg link "$LINK" --arg min "$MIN" --arg max "$MAX" '{
            addons: { ($id): { updates: [ {
              version: $v,
              update_link: $link,
              applications: { zotero: { strict_min_version: $min, strict_max_version: $max } }
            } ] } }
          }' > dist/updates.json
          cat dist/updates.json

      - name: Tag und Release erstellen
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/zotero-auto-translate-$VERSION.xpi" \
            dist/updates.json \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
